<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>认知掌控侧车</title>
  <style>
    :root {
      --ink: #2c2c2a;
      --muted: #5f5e5a;
      --line: #e3e1da;
      --bg: #ffffff;
      --card: #f7f6f2;
      --blue: #185fa5;
      --red: #a32d2d;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --ink: #ecebe6;
        --muted: #a5a49d;
        --line: #3a3a37;
        --bg: #1b1b19;
        --card: #24241f;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      color: var(--ink);
      font: 13.5px/1.7 -apple-system, "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
      padding: 20px;
    }
    .card {
      width: 100%;
      max-width: 380px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 18px 16px;
    }
    h1 { font-size: 15px; font-weight: 600; margin: 0 0 2px; }
    .sub { color: var(--muted); font-size: 11.5px; margin-bottom: 14px; }
    .row { display: flex; align-items: center; gap: 8px; margin: 10px 0; }
    .dot { width: 8px; height: 8px; border-radius: 50%; flex: 0 0 auto; background: var(--muted); }
    .dot.ok { background: #0f6e56; }
    .dot.bad { background: var(--red); }
    .dot.wait { background: #ba7517; }
    #status { font-size: 13px; }
    .hint { color: var(--muted); font-size: 11.5px; margin-top: 6px; }
    button {
      font: inherit;
      font-size: 13px;
      min-height: 34px;
      padding: 5px 12px;
      border-radius: 9px;
      border: 1px solid var(--line);
      background: var(--bg);
      color: var(--ink);
      cursor: pointer;
    }
    button.primary { background: var(--blue); border-color: var(--blue); color: #fff; width: 100%; }
    button:disabled { opacity: 0.5; cursor: default; }
    input {
      font: inherit;
      font-size: 13px;
      width: 88px;
      min-height: 32px;
      padding: 4px 8px;
      border-radius: 9px;
      border: 1px solid var(--line);
      background: var(--bg);
      color: var(--ink);
    }
    a { color: var(--blue); }
    .port { display: flex; align-items: center; gap: 8px; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); }
    .port label { color: var(--muted); font-size: 11.5px; }
    code { font-size: 12px; background: var(--bg); padding: 1px 5px; border-radius: 5px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>认知掌控侧车</h1>
    <div class="sub">窄栏模式 · 只连本地服务，不读你正在看的网页</div>

    <div class="row">
      <span class="dot wait" id="dot"></span>
      <span id="status">正在检查本地服务…</span>
    </div>
    <div class="hint" id="hint"></div>

    <div class="row" style="margin-top:14px">
      <button class="primary" id="retry" disabled>正在连接…</button>
    </div>

    <div class="port">
      <label for="port">端口</label>
      <input id="port" type="number" min="1024" max="65535" step="1" value="8501" />
      <span class="hint" style="margin:0">改完点重试</span>
    </div>
  </div>
  <script src="panel.js"></script>
</body>
</html>
